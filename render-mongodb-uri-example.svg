<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#f3f6f8"/>
<rect x="60" y="45" width="1080" height="610" rx="22" fill="#fff" stroke="#d8e0e7" stroke-width="2"/>
<text x="100" y="105" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172b4d">Render Environment: MONGODB_URI</text>
<text x="100" y="155" font-family="Arial,sans-serif" font-size="22" fill="#526273">Edit this variable in your Render service. Replace the placeholders only.</text>
<rect x="100" y="195" width="1000" height="150" rx="12" fill="#101820"/>
<text x="130" y="255" font-family="Consolas,monospace" font-size="23" fill="#f7fafc">mongodb+srv://</text>
<text x="340" y="255" font-family="Consolas,monospace" font-size="23" fill="#7dd3fc">DB_USERNAME</text>
<text x="507" y="255" font-family="Consolas,monospace" font-size="23" fill="#f7fafc">:</text>
<text x="525" y="255" font-family="Consolas,monospace" font-size="23" fill="#fca5a5">DB_PASSWORD</text>
<text x="700" y="255" font-family="Consolas,monospace" font-size="23" fill="#f7fafc">@</text>
<text x="720" y="255" font-family="Consolas,monospace" font-size="23" fill="#fde68a">CLUSTER_HOST</text>
<text x="130" y="305" font-family="Consolas,monospace" font-size="23" fill="#f7fafc">.mongodb.net/helpdesk?retryWrites=true&amp;w=majority</text>
<path d="M405 270 C405 390 300 380 300 425" fill="none" stroke="#0284c7" stroke-width="4"/>
<path d="M590 270 C590 395 825 380 825 425" fill="none" stroke="#dc2626" stroke-width="4"/>
<rect x="115" y="430" width="405" height="135" rx="12" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
<text x="145" y="475" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#075985">DB_USERNAME</text>
<text x="145" y="515" font-family="Arial,sans-serif" font-size="18" fill="#334155">Your Atlas database user name</text>
<rect x="625" y="430" width="460" height="135" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
<text x="655" y="475" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#991b1b">DB_PASSWORD</text>
<text x="655" y="515" font-family="Arial,sans-serif" font-size="18" fill="#334155">Your new Atlas database password</text>
<text x="100" y="610" font-family="Arial,sans-serif" font-size="18" fill="#475569">Keep the cluster host from Atlas. URL-encode reserved characters in the password.</text>
<text x="100" y="637" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#b91c1c">Never post the completed URI publicly or send it in chat.</text>
</svg>
